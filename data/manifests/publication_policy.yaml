schema_version: 1
as_of: 2026-08-10

default_release_policy:
  raw_market_data: local_only
  derived_market_rows: local_only_unless_redistribution_is_authorized
  metadata_and_checksums: publish
  preprocessing_and_validation_code: publish

sources:
  nasdaq_public_itch:
    provider: Nasdaq
    market: XNAS
    granularity: TotalView-ITCH 5.0 order-level source
    official_url: https://emi.nasdaq.com/ITCH/
    specification_url: https://www.nasdaqtrader.com/content/technicalsupport/specifications/dataproducts/NQTVITCHSpecification_5.0.pdf
    raw_release: local_only
    derived_release: metadata_only_unless_redistribution_is_authorized
    metadata_release: publish

  databento_xnas:
    provider: Databento
    market: XNAS.ITCH
    granularity: MBP-10 snapshots
    official_url: https://databento.com/docs/schemas-and-data-formats/whats-a-schema
    licensing_url: https://databento.com/pricing/
    raw_release: local_only
    derived_release: metadata_only_unless_redistribution_is_authorized
    metadata_release: publish

dataset_families:
  public_itch_multi_asset:
    source_id: nasdaq_public_itch
    symbols: [AAPL, AMZN, GOOG, INTC]
    sampling: [event, 1s]
    dates: [2019-01-30, 2019-03-27, 2019-07-30, 2019-08-30, 2019-10-30, 2019-12-30]
    publication_scope: code_metadata_and_checksums

  goog_databento_mbp10:
    source_id: databento_xnas
    symbols: [GOOG]
    sampling: event
    publication_scope: code_metadata_and_checksums

